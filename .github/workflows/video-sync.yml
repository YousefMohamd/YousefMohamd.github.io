name: Video Sync

on:
  push:
    paths:
      - 'projects/short-film-*.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet yt-dlp
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Setup rclone config
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'RCLONE_EOF'
          [b2]
          type = b2
          account = ${{ secrets.B2_KEY_ID }}
          key = ${{ secrets.B2_APP_KEY }}
          endpoint = https://api003.backblazeb2.com
          hard_delete = true
          RCLONE_EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Restore Vimeo cookies
        run: |
          echo "${{ secrets.VIMEO_COOKIES_B64 }}" | base64 -d > /tmp/cookies.txt
          chmod 600 /tmp/cookies.txt

      - name: Run video pipeline
        env:
          VIMEO_COOKIES: /tmp/cookies.txt
          WORK: /tmp/videos
          B2_BUCKET: b2:yousef-films
          B2_CDN: https://b2-video.mohamedyou1357.workers.dev
          QUALITIES: 720 480 360
        run: |
          mkdir -p $WORK
          bash scripts/video-pipeline.sh --md projects

      - name: Summary
        if: always()
        run: |
          echo "## Video Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### B2 storage" >> $GITHUB_STEP_SUMMARY
          rclone size b2:yousef-films/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          rclone lsf b2:yousef-films/ --recursive | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
